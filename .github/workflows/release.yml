name: Release

on:
  push:
    tags: [v*]

permissions:
  checks: read
  pull-requests: read
  contents: write

jobs:
  release:
    uses: cpeter1207/rptadv-samplerate-adapter-workflows/.github/workflows/release.yml@main
    with:
      code_ref: ${{ github.sha }}
      tag: ${{ github.ref_name }}
    secrets:
      APT_INDEX_DISPATCH_TOKEN: ${{ secrets.APT_INDEX_DISPATCH_TOKEN }}
